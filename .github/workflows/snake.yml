# ================================================================
#  File path:  .github/workflows/snake.yml
#  Repo:       RiyanOzair/RiyanOzair
#
#  BEFORE running this for the first time:
#  → Repo Settings → Actions → General
#  → Workflow permissions → "Read and write permissions" → Save
#
#  Then: Actions tab → "Generate Snake" → "Run workflow"
#  The snake SVGs will appear in the "output" branch within 30s.
# ================================================================

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"      # every day at midnight UTC
  workflow_dispatch:           # run manually from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RiyanOzair
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
          commit_message: "chore: update snake [skip ci]"
